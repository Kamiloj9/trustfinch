name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate source and audit history
        env:
          PACKAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] \
            || { echo "Release tag must be a safe v-prefixed semantic version: $PACKAGE_TAG" >&2; exit 1; }
          mkdir -p release-assets
          make test 2>&1 | tee "release-assets/trustfinch-${PACKAGE_TAG}.test-summary.txt"
          make public-audit 2>&1 | tee "release-assets/trustfinch-${PACKAGE_TAG}.public-audit.txt"
      - name: Build source archive and SPDX SBOM
        env:
          PACKAGE_TAG: ${{ github.ref_name }}
          SYFT_IMAGE: anchore/syft@sha256:c15fa8af4c25edd72c0daf026d095fe51adbcfc7ad5d79a66e93d88f249e5abb
        run: |
          set -euo pipefail
          package="trustfinch-${PACKAGE_TAG}"
          release_dir="$PWD/release-assets"
          source_dir="$release_dir/source"
          mkdir -p "$source_dir"
          git archive --format=tar.gz --prefix="${package}/" "$GITHUB_SHA" >"$release_dir/${package}.tar.gz"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_dir"
          docker run --rm \
            -v "$source_dir:/source:ro" \
            -v "$release_dir:/out" \
            "$SYFT_IMAGE" dir:/source -o "spdx-json=/out/${package}.spdx.json"
          jq -n \
            --arg tag "$PACKAGE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg source_archive "${package}.tar.gz" \
            --arg sbom "${package}.spdx.json" \
            '{schema_version: 1, project: "Trustfinch", tag: $tag, commit: $commit, source_archive: $source_archive, sbom: $sbom, validation: ["make test", "make public-audit"]}' \
            >"$release_dir/${package}.evidence.json"
          (
            cd "$release_dir"
            sha256sum "${package}.tar.gz" "${package}.spdx.json" "${package}.evidence.json" \
              >"${package}.checksums.txt"
          )
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="trustfinch-${PACKAGE_TAG}"
          prerelease=()
          if [[ "$PACKAGE_TAG" == v0.* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$PACKAGE_TAG" \
            "release-assets/${package}.tar.gz" \
            "release-assets/${package}.spdx.json" \
            "release-assets/${package}.evidence.json" \
            "release-assets/${package}.checksums.txt" \
            "release-assets/${package}.test-summary.txt" \
            "release-assets/${package}.public-audit.txt" \
            --title "Trustfinch ${PACKAGE_TAG}" \
            --generate-notes \
            "${prerelease[@]}"
