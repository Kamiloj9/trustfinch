name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Local Docker validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          install -d "$HOME/.docker/cli-plugins"
          curl --fail --location --silent --show-error \
            --output "$HOME/.docker/cli-plugins/docker-compose" \
            https://github.com/docker/compose/releases/download/v5.3.1/docker-compose-linux-x86_64
          printf '%s  %s\n' \
            f9ebc6ebdb19d769b793c245a736caaeb198c62587f13b25c660c13b4987f959 \
            "$HOME/.docker/cli-plugins/docker-compose" | sha256sum --check
          chmod 0755 "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Run Docker acceptance suite
        run: make test
      - name: Audit source tree and reachable history
        run: make public-audit
